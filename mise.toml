[settings]
always_keep_install = false  # deleted on failure by default

verbose = false       # set to true to see full installation output, see `MISE_VERBOSE`
http_timeout = "30s"  # set the timeout for http requests as duration string, see `MISE_HTTP_TIMEOUT`
jobs = 4              # number of plugins or runtimes to install in parallel. The default is `4`.
raw = false           # set to true to directly pipe plugins to stdin/stdout/stderr

not_found_auto_install = true # see MISE_NOT_FOUND_AUTO_INSTALL

env_file = '.env' # load env vars from a dotenv file, see `MISE_ENV_FILE`

experimental = true # enable experimental features

[tasks.build]
description = "Build pdfmeta for release; extra arguments go to swift build, e.g. --arch arm64"
run = "swift build -c release"

[tasks.test]
description = "Run the unit tests, killed if they run past 60 seconds"
# the suite takes about a second; a runaway test once filled the disk with swap,
# so the whole process group is killed at the limit
run = '''
swift build --build-tests
perl -e '$pid = fork; if (!$pid) { setpgrp(0, 0); exec @ARGV } $SIG{ALRM} = sub { kill "KILL", -$pid; die "tests killed after 60 seconds\n" }; alarm 60; waitpid($pid, 0); exit($? >> 8)' swift test --skip-build
'''

[tasks.pdfmeta]
description = "Build if needed and run pdfmeta, e.g. mise run pdfmeta process-all ~/Papers --dry-run"
run = "swift run -c release --quiet pdfmeta"

[tasks."pkl:gen"]
description = "Generate GitHub Actions YAML from pkl sources"
# scoped to this task: pkl has no macOS Intel build, and the other tasks run on Intel runners
tools = { pkl = "latest" }
run = "pkl eval -m .github/ --project-dir .github/pkl .github/pkl/index.pkl"
