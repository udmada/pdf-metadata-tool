[project]
name = "pdf-metadata-tool"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "udmada", email = "git@adamdu.nz" }
]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "click>=8.0.0",
