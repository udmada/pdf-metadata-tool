# Generated from Workflow.pkl. DO NOT EDIT.
name: Build pdfmeta
'on':
  push:
    branches:
    - '**'
  workflow_call: {}
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Test and build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
        - arch: arm64
          runner: macos-26
        - arch: x86_64
          runner: macos-15-intel
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 1
    - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      with:
        install: false
    - name: Show toolchain
      run: swift --version
    - name: Test
      timeout-minutes: 10
      run: mise run test
    - name: Build
      run: |-
        mise run build --arch ${{ matrix.arch }}
        bin="$(swift build -c release --arch ${{ matrix.arch }} --show-bin-path)/pdfmeta"
        lipo -info "$bin"
        "$bin" --help
        mkdir -p dist
        tar -czf "dist/pdfmeta-macos-${{ matrix.arch }}.tar.gz" -C "$(dirname "$bin")" pdfmeta
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: pdfmeta-macos-${{ matrix.arch }}
        path: dist/pdfmeta-macos-${{ matrix.arch }}.tar.gz
        if-no-files-found: error
  universal:
    name: Universal binary
    needs: build
    runs-on: macos-26
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        path: dist
        pattern: pdfmeta-macos-*
        merge-multiple: true
    - name: Merge with lipo
      run: |-
        mkdir -p arm64 x86_64
        tar -xzf "dist/pdfmeta-macos-arm64.tar.gz" -C arm64
        tar -xzf "dist/pdfmeta-macos-x86_64.tar.gz" -C x86_64
        lipo -create arm64/pdfmeta x86_64/pdfmeta -output pdfmeta
        lipo -info pdfmeta
        ./pdfmeta --help
        tar -czf "dist/pdfmeta-macos-universal.tar.gz" pdfmeta
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: pdfmeta-macos-universal
        path: dist/pdfmeta-macos-universal.tar.gz
        if-no-files-found: error
